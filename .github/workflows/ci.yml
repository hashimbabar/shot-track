name: ci

on:
  push:
  pull_request:

jobs:
  firmware:
    name: build firmware (nucleo_l432kc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PlatformIO downloads the ARM compiler and ST's HAL on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-fw-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: build
        run: pio run -e nucleo_l432kc
      # FreeRTOS's Cortex-M4F port needs hard-float. Check the linked ELF
      # really says so, instead of trusting that fpu.py did its job.
      - name: check the firmware uses the hardware fpu
        run: |
          readelf=~/.platformio/packages/toolchain-gccarmnoneeabi/bin/arm-none-eabi-readelf
          $readelf -A .pio/build/nucleo_l432kc/firmware.elf | tee attrs.txt
          grep -q "Tag_ABI_VFP_args: VFP registers" attrs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-nucleo_l432kc
          path: |
            .pio/build/nucleo_l432kc/firmware.elf
            .pio/build/nucleo_l432kc/firmware.bin

  unit-tests:
    name: unit tests (native, Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: run tests
        run: pio test -e native

  replay:
    name: replay synthetic sessions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      # SYNTHETIC data only: these sessions come from the simulator, not a
      # wrist. Passing means the detection code behaves as designed, not
      # that it is accurate on real shots.
      - name: generate synthetic sessions
        run: |
          for seed in 1 2 3; do
            python tools/simulate_session.py --seed $seed --shots 25 --out data/synthetic/session_0$seed.csv
          done
      - name: replay through the host-built detector
        run: python tools/replay.py --check data/synthetic/*.csv
