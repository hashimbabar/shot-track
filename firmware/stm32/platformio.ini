; PlatformIO project for the shottrack firmware on a NUCLEO-L432KC.
;
; Build:   pio run
; Upload:  pio run -t upload       (or the arrow button in VS Code)
; Serial:  pio device monitor      (or the plug button in VS Code)

[env:nucleo_l432kc]
; Pinned so a platform update can't change the build without us noticing.
platform = ststm32@20.0.0
board = nucleo_l432kc
; stm32cube = ST's own HAL drivers, the same ones CubeIDE uses, but built
; from this file instead of a GUI generator.
framework = stm32cube

; Use our own include/stm32l4xx_hal_conf.h instead of a generated one.
board_build.stm32cube.custom_config_header = yes

; Turn on the hardware floating point unit (needed by the FreeRTOS
; Cortex-M4F port, and by the filtering code later).
extra_scripts = pre:fpu.py

; Warnings for our code only, not for ST's or FreeRTOS's sources.
build_src_flags = -Wall -Wextra

upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200
monitor_eol = LF
