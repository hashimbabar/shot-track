; ShotTrack - PlatformIO project
;
;   pio run -e nucleo_l432kc              build the firmware
;   pio run -e nucleo_l432kc -t upload    flash the Nucleo over its ST-LINK
;   pio device monitor                    serial console, 115200 baud
;   pio test -e native                    run the unit tests on the PC

[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = nucleo_l432kc

[env:nucleo_l432kc]
; Pinned so a platform update can't change the build without us noticing.
platform = ststm32@20.0.0
board = nucleo_l432kc
; stm32cube = ST's own HAL drivers, built from this file, no CubeMX.
framework = stm32cube
; Use our own firmware/include/stm32l4xx_hal_conf.h.
board_build.stm32cube.custom_config_header = yes
; Hardware FPU for every object file (FreeRTOS CM4F port + float math).
extra_scripts = pre:firmware/fpu.py
; Warnings for our code only, not ST's or FreeRTOS's.
build_src_flags = -Wall -Wextra
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:native]
; Host build for unit tests. Only the hardware-independent libraries
; (lib/mpu6050 with a mocked I2C bus, lib/detect) are compiled here.
platform = native
test_framework = unity
build_flags = -std=c11 -Wall -Wextra -lm
lib_ignore = FreeRTOS, FatFs
